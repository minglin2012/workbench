<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作台</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 背景渐变 -->
    <div class="bg-gradient"></div>

    <!-- 确认对话框（隐藏） -->
    <div class="modal-overlay" id="confirm-modal" style="display:none;">
        <div class="modal">
            <div class="modal-icon">⚠️</div>
            <h3 id="confirm-title">切换项目环境</h3>
            <p id="confirm-message"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                <button class="btn btn-primary" id="confirm-ok">确认切换</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toast-container"></div>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">⚡ 工作台</h1>
            </div>
            <div class="header-center">
                <!-- 当前环境状态条 -->
                <div class="status-bar" id="status-bar" style="display:none;">
                    <span class="status-dot active" id="status-dot"></span>
                    <span id="status-text">未启动</span>
                    <button class="btn btn-sm btn-ghost" id="btn-close-current" title="关闭当前环境">✕</button>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-icon" id="btn-history" title="历史记录">📋</button>
                <button class="btn btn-icon" id="btn-reload" title="重新加载配置">🔄</button>
                <button class="btn btn-icon" id="btn-theme" title="切换主题">🌙</button>
            </div>
        </header>

        <!-- 搜索和筛选 -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="搜索项目...">
                <button class="search-clear" id="search-clear" style="display:none;">✕</button>
            </div>
            <div class="category-tabs" id="category-tabs">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 项目卡片网格 -->
            <div class="projects-grid" id="projects-grid">
                <!-- 动态生成 -->
            </div>

            <!-- 进程面板 -->
            <div class="process-panel" id="process-panel" style="display:none;">
                <div class="process-panel-header">
                    <h3>🔗 进程/窗口绑定</h3>
                    <span class="process-panel-badge" id="process-count">0 个进程</span>
                    <button class="btn btn-sm btn-ghost" id="btn-toggle-process" title="折叠">▼</button>
                </div>
                <div class="process-list" id="process-list">
                    <!-- 动态生成 -->
                </div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="empty-state" style="display:none;">
                <div class="empty-icon">📭</div>
                <h3>没有找到项目</h3>
                <p>请检查 projects.yaml 配置文件</p>
            </div>
        </div>
    </div>

    <!-- 历史记录侧边栏 -->
    <div class="drawer-overlay" id="history-overlay" style="display:none;"></div>
    <div class="drawer" id="history-drawer">
        <div class="drawer-header">
            <h3>📋 历史记录</h3>
            <button class="btn btn-icon" id="btn-history-close">✕</button>
        </div>
        <div class="drawer-body" id="history-list">
            <!-- 动态生成 -->
        </div>
        <div class="drawer-footer">
            <button class="btn btn-ghost btn-sm" id="btn-clear-history">清空全部</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
