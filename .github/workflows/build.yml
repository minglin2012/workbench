name: Build & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install fastapi uvicorn PyYAML pystray Pillow pywin32 psutil pyinstaller

      - name: Build Workbench.exe
        run: pyinstaller workbench.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 方法1: winget (Windows 自带)
          winget install --id=JRSoftware.InnoSetup --exact --accept-source-agreements --accept-package-agreements --silent 2>$null
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
            echo "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "ISCC_INSTALLED=1" >> $env:GITHUB_ENV
          } else {
            # 方法2: 直接下载便携版
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_3_3/innosetup-6.3.3.exe"
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\is.exe" -ErrorAction Stop
            Start-Process "$env:TEMP\is.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$env:TEMP\is`"" -Wait
            $iscc = "$env:TEMP\is\ISCC.exe"
            if (Test-Path $iscc) {
              echo "$env:TEMP\is" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "ISCC_INSTALLED=1" >> $env:GITHUB_ENV
            }
          }

      - name: Build Setup installer
        if: env.ISCC_INSTALLED == '1'
        run: iscc installer.iss

      - name: Generate version
        id: ver
        shell: pwsh
        run: echo "version=$(Get-Date -Format 'yyyy.M.d').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Workbench-${{ steps.ver.outputs.version }}
          path: |
            dist/Workbench.exe
            dist/Workbench-Setup-*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.version }}
          files: |
            dist/Workbench.exe
            dist/Workbench-Setup-*.exe
          generate_release_notes: true
