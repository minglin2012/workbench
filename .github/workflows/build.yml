name: Build & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install fastapi uvicorn PyYAML pystray Pillow pywin32 psutil pyinstaller

      - name: Build Workbench.exe
        run: pyinstaller workbench.spec --noconfirm

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 尝试 winget，失败则用 choco
          winget install --id=JRSoftware.InnoSetup --exact --accept-source-agreements --accept-package-agreements --silent 2>$null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y 2>$null
          }
          if (Test-Path $iscc) {
            echo "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "Inno Setup not found"
          }

      - name: Build Setup installer
        run: iscc installer.iss

      - name: Generate version
        id: ver
        shell: pwsh
        run: echo "version=$(Get-Date -Format 'yyyy.M.d').${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Workbench-${{ steps.ver.outputs.version }}
          path: |
            dist/Workbench.exe
            dist/Workbench-Setup-*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Workbench.exe
            dist/Workbench-Setup-*.exe
          generate_release_notes: true
